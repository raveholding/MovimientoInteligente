<html lang="es"><head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Menú Movimiento Inteligente</title>

<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Concepto: menú de bienvenida de cristal sobre la misma nebulosa nocturna del sistema; una sola columna pensada para el celular. */
:root{
  --bg:#060b21; --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12); --rim:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.12); --fg:#eaeefb; --muted:#9ea9cc; --field:rgba(4,10,34,.55);
  --teal:#3de0c5; --pink:#ff6aa9; --amber:#ffb85c; --ok:#34d399; --bad:#ff5d6c;
  --ok-soft:rgba(52,211,153,.15); --warn-soft:rgba(255,184,92,.16); --mute-soft:rgba(255,255,255,.08);
  --on-solid:#04122a; --shadow:0 12px 40px rgba(0,0,0,.38);
  --blob1:rgba(61,224,197,.22); --blob2:rgba(255,106,169,.18); --blob3:rgba(86,110,255,.2);
  --font-d:'Fraunces',Georgia,'Times New Roman',serif; --font-u:'Jost','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9eef9; --glass:rgba(255,255,255,.7); --glass-2:rgba(255,255,255,.92); --rim:rgba(255,255,255,.95);
    --line:rgba(10,22,70,.13); --fg:#0d1633; --muted:#4a5578; --field:rgba(255,255,255,.92);
    --teal:#0a8a78; --pink:#b81d65; --amber:#935400; --ok:#0a7d55; --bad:#c0263a;
    --ok-soft:rgba(10,125,85,.12); --warn-soft:rgba(147,84,0,.13); --mute-soft:rgba(10,22,70,.07);
    --on-solid:#ffffff; --shadow:0 10px 30px rgba(30,45,110,.14);
    --blob1:rgba(10,138,120,.2); --blob2:rgba(184,29,101,.14); --blob3:rgba(60,90,230,.16); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e9eef9; --glass:rgba(255,255,255,.7); --glass-2:rgba(255,255,255,.92); --rim:rgba(255,255,255,.95);
  --line:rgba(10,22,70,.13); --fg:#0d1633; --muted:#4a5578; --field:rgba(255,255,255,.92);
  --teal:#0a8a78; --pink:#b81d65; --amber:#935400; --ok:#0a7d55; --bad:#c0263a;
  --ok-soft:rgba(10,125,85,.12); --warn-soft:rgba(147,84,0,.13); --mute-soft:rgba(10,22,70,.07);
  --on-solid:#ffffff; --shadow:0 10px 30px rgba(30,45,110,.14);
  --blob1:rgba(10,138,120,.2); --blob2:rgba(184,29,101,.14); --blob3:rgba(60,90,230,.16); color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-u);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:70}
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 420px at 12% 6%,var(--blob1),transparent 70%),radial-gradient(560px 460px at 94% 20%,var(--blob3),transparent 70%),radial-gradient(600px 480px at 70% 98%,var(--blob2),transparent 70%)}
.wrap{max-width:760px;margin:0 auto;min-width:0;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,8vw,46px);line-height:1.08}
h2{font-size:25px}h3{font-size:18px}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{border-radius:12px;display:block;border:1px solid var(--line)}
.b1{font-weight:300;font-size:15px;letter-spacing:.08em;line-height:1.1;overflow-wrap:anywhere}
.b2{font-weight:600;font-size:12px;letter-spacing:.3em;margin-top:3px;color:var(--teal);overflow-wrap:anywhere}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;box-shadow:inset 0 1px 0 var(--rim),var(--shadow);padding:20px;min-width:0}
.btn{min-height:52px;padding:0 22px;border-radius:14px;border:1px solid transparent;background:var(--teal);color:var(--on-solid);font:600 16px var(--font-u);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.ghost{background:var(--glass-2);color:var(--fg);border-color:var(--line)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{display:flex;flex-direction:column;gap:16px;padding:26px 22px}
.hero .lead{font-size:17px;color:var(--muted);max-width:56ch}
.banner{border:1px solid var(--amber);background:var(--warn-soft);border-radius:16px;padding:12px 16px;font-size:14.5px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec>.hd{display:flex;flex-direction:column;gap:4px}
.sec .sub{color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pil{display:flex;flex-direction:column;gap:6px}
.plan{display:flex;flex-direction:column;gap:10px}
.plan .pr{font-family:var(--font-d);font-size:32px;font-variant-numeric:tabular-nums;line-height:1}
.plan .pr small{font-family:var(--font-u);font-size:14px;color:var(--muted)}
.chip{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap;align-self:flex-start}
.cls{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--mute-soft)}
.cls .tm{font-family:var(--font-d);font-size:22px;font-variant-numeric:tabular-nums}
.day{display:flex;flex-direction:column;gap:10px}
.meta{font-size:13.5px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:600;background:var(--teal);color:var(--on-solid)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);font:400 16px var(--font-u);padding:10px 14px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
input[type="checkbox"]{width:24px;height:24px;min-height:0;accent-color:var(--teal);flex:0 0 auto}
.chk{flex-direction:row;align-items:flex-start;gap:12px;color:var(--fg);font-size:15px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.done{border-color:var(--ok);background:var(--ok-soft)}
.club{border-radius:20px;padding:18px;background:linear-gradient(145deg,#0b1a52,#0a0f33 55%,#2a0f45);color:#eaeefb;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.club .cn{font-family:var(--font-d);font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.club .cm{font-size:13px;color:#b8c2e6;margin-top:4px}
.club .ck{font-size:11px;letter-spacing:.24em;color:#3de0c5;font-weight:600}
.club .code{font-variant-numeric:tabular-nums;letter-spacing:.12em;font-size:13px;margin-top:10px}
.qr{background:#fff;padding:8px;border-radius:12px;width:148px;height:148px;display:flex;align-items:center;justify-content:center;color:#04122a;font-size:12px;text-align:center}
@media (max-width:420px){.club{grid-template-columns:1fr}.qr{justify-self:center}}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:10px;justify-content:center;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cta .btn{flex:1 1 0;max-width:340px}
.devfoot{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.devfoot img{border-radius:12px;display:block;max-width:100%;height:auto}
.devfoot .tg{font-size:14px;color:var(--muted);max-width:52ch}
.mail{font-variant-numeric:tabular-nums;user-select:all;overflow-wrap:anywhere;font-weight:500;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:500;font-size:15px;z-index:90;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
details summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:44px;display:flex;align-items:center}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .15s,transform .1s}.btn:active{transform:scale(.98)}}
</style>

  '<label class="chk full" for="m-s"><input id="m-s" name="s" type="checkbox"> Declaro que estoy en condiciones de realizar actividad física y que los datos son verdaderos.</label>'+
  '<label class="chk full" for="m-c"><input id="m-c" name="c" type="checkbox" checked> Acepto recibir mensajes por WhatsApp sobre mi cuota y novedades.</label>'+
  '<div class="err full" id="m-err" role="alert"></div><div class="full"><button class="btn" type="submit" style="width:100%">Preparar mi solicitud</button></div></form><div id="m-res"></div></section>'+
  '<footer class="glass"><div class="hd" style="margin-bottom:12px"><h3>Contacto</h3></div>'+(cfg.a?'<p class="meta" style="margin-bottom:6px">'+esc(cfg.a)+'</p>':'')+'<p class="meta" style="margin-bottom:14px">WhatsApp '+esc(waNum().replace(/^549?/,'').replace(/^(\d{3})(\d+)$/,'($1) $2'))+'</p><div class="devfoot"><div class="row" style="flex:1 1 300px"><img src="'+DEV.logo+'" width="180" height="57" alt="Logo de Vincular Business"><div><div class="eyebrow">Sistema desarrollado por</div><b>'+DEV.name+'</b><div class="tg">'+DEV.tag+'</div></div></div><div class="row"><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+DEV.wa+'?text='+encodeURIComponent('Hola Vincular Business, vi el menú de '+cfg.b+' y quiero un sistema para mi negocio.')+'">WhatsApp '+DEV.waTxt+'</a><span class="mail">'+DEV.mail+'</span><button class="btn sm ghost" type="button" data-a="copyMail">Copiar email</button></div></div></footer>'+
  '<div class="cta"><button class="btn" type="button" data-a="goForm">Quiero asociarme</button><a class="btn ghost" target="_blank" rel="noopener" href="'+waLink('Hola, quiero más información sobre '+cfg.b+'.')+'">WhatsApp</a></div>';
}
function render(){
  $('#app').innerHTML=html();
  if(card){const el=$('#qr');if(el){try{new QRCode(el,{text:card.c,width:132,height:132,colorDark:'#04122a',colorLight:'#ffffff'})}catch(e){el.textContent=card.c}}}
}
async function copyText(t,okMsg){try{await navigator.clipboard.writeText(t);toast(okMsg)}catch(e){const a=$('#msg');if(a){a.parentElement.open=true;a.focus();a.select()}toast('Seleccioná el texto y copialo')}}
const A={
  goForm(){const e=$('#alta');if(e)e.scrollIntoView({behavior:'smooth',block:'start'});const i=$('#m-n');if(i)setTimeout(()=>i.focus({preventScroll:true}),400)},
  pick(d){const p=(cfg.p||[])[+d.i];if(p){$('#m-p').value=p[0];A.goForm();toast('Plan elegido: '+p[0])}},
  rmCard(){card=null;try{localStorage.removeItem('mi-tarjeta')}catch(e){}render()},
  copyMail(){copyText(DEV.mail,'Email copiado')},
  copyMsg(){copyText(lastMsg,'Mensaje copiado')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('submit',e=>{
  if(e.target.id!=='f-alta')return;e.preventDefault();
  const fd=new FormData(e.target),n=fd.get('n').trim(),d=fd.get('d').replace(/\D/g,''),w=fd.get('w').replace(/\D/g,''),err=$('#m-err');
  if(n.length<3){err.textContent='Escribí tu nombre y apellido.';return}
  if(d.length<6||d.length>9){err.textContent='Revisá el documento: tiene que tener entre 6 y 9 números.';return}
  if(w.length<8){err.textContent='Revisá tu WhatsApp: incluí el código de área.';return}
  if(fd.get('s')!=='on'){err.textContent='Para continuar, tenés que aceptar la declaración de salud.';return}
  err.textContent='';
  const lead={n:n,d:d,w:w,p:fd.get('p'),g:fd.get('g').trim(),h:fd.get('h').trim(),s:1,c:fd.get('c')==='on'?1:0,f:new Date().toISOString().slice(0,10)};
  lastMsg='Hola '+(cfg.o||cfg.b)+', quiero asociarme a '+cfg.b+'.\nNombre: '+n+'\nDocumento: '+d+'\nWhatsApp: '+w+'\nPlan: '+lead.p+(lead.g?'\nObjetivo: '+lead.g:'')+(lead.h?'\nCuidados de salud: '+lead.h:'')+'\n\nCódigo de alta (no lo borres): ALTA1.'+b64e(lead);
  $('#m-res').innerHTML='<div class="glass done" style="margin-top:16px;display:flex;flex-direction:column;gap:12px"><h3>Listo, '+esc(n.split(' ')[0])+'. Falta un paso.</h3><p>Enviá tu solicitud por WhatsApp para que '+esc(cfg.b)+' la reciba. No cambies el código del final del mensaje.</p><div class="row"><a class="btn" target="_blank" rel="noopener" href="'+waLink(lastMsg)+'">Enviar por WhatsApp</a><button class="btn ghost" type="button" data-a="copyMsg">Copiar el mensaje</button></div><details><summary>Ver el mensaje</summary><textarea id="msg" readonly style="min-height:150px">'+esc(lastMsg)+'</textarea></details></div>';
  $('#m-res').scrollIntoView({behavior:'smooth',block:'center'});
});
try{const th=localStorage.getItem('mi-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
render();
})();
</script>

<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body></html>
